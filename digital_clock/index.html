<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Display</title>

    <style>
        body {
            background-color: black;
            height: 100vh;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        #time{
            height: 30vh;
            width: 80vw;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid white;
            background:linear-gradient(to bottom,#b587e4,#e94888,#870f39);
        }

        .time {
            height: 50vh;
            width: 50vh;
            border: 2px solid white;
        }

        #time {
            font-size: 50px;
            user-select: none;
        }
    </style>
</head>

<body>
    <div id="time"></div>

    <script src="first.js"></script>
</body>
</html>
